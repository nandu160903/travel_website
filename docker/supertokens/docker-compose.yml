# Self-hosted SuperTokens Core (separate DB from Supabase).
# Usage:
#   cd docker/supertokens
#   cp .env.example .env   # set POSTGRES_PASSWORD
#   docker compose up -d
# Core API: http://localhost:3567  →  SUPERTOKENS_CONNECTION_URI=http://localhost:3567
#
# Production: deploy this stack on Railway/Render/Fly with HTTPS in front of port 3567.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: supertokens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: supertokens
    volumes:
      - supertokens_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supertokens -d supertokens"]
      interval: 5s
      timeout: 5s
      retries: 10

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:9.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3567:3567"
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://supertokens:${POSTGRES_PASSWORD}@db:5432/supertokens

volumes:
  supertokens_pg:
